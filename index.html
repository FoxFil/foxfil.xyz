  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    color: #ccc;
    font-family: 'Open Sans', sans-serif;
    font-weight: 400;
    font-size: 17px;
    line-height: 1.85;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
  }

  .page {
    width: 100%;
    max-width: 780px;
    margin: auto;
    padding: 0 2rem;
  }

  /* Contacts */
  .contacts {
    padding: 3.5rem 0;
    text-align: center;
  }

  .contact-list {
    display: inline-flex;
    flex-direction: column;
    gap: 0.9rem;
    text-align: left;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    text-decoration: none;
    color: inherit;
  }

  .contact-item svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    fill: #888;
  }

  .c-label { color: #888; font-size: 1rem; font-weight: 400; white-space: nowrap; }
  .c-value { color: #ddd; font-size: 1rem; font-weight: 700; white-space: nowrap; transition: color 0.15s; }
  .contact-item:hover .c-value { color: #f97316; }

  /* Webring */
  footer {
    border-top: 1px solid #222;
    padding: 3rem 0 4rem;
    text-align: center;
  }

  .webring {
    display: inline-flex;
    align-items: center;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    overflow: hidden;
  }

  .webring a {
    color: #bbb;
    text-decoration: none;
    padding: 0.5rem 1.1rem;
    font-size: 0.95rem;
    font-family: 'Open Sans', sans-serif;
    transition: background 0.2s, color 0.2s;
  }

  .webring a:hover { background: #f97316; color: #000; }

  .webring-mid {
    font-size: 0.75rem !important;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-left: 1px solid #2a2a2a;
    border-right: 1px solid #2a2a2a;
  }
</style>
